services:
  - type: web
    name: stream-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stream-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TWITCH_EVENTSUB_SECRET
        generateValue: true
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_VERIFY_TOKEN
        generateValue: true

databases:
  - name: stream-postgres
    plan: free
    region: oregon
    databaseName: stream_db
    user: stream_user
